services:
  api:
    build:
      context: .
    image: fraud-detector-api:local
    ports:
      - "8000:8000"
    environment:
      FRAUD_DEPLOYMENT_CONFIG: /app/config/deployment.json
    volumes:
      - ./artifacts:/app/artifacts:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
